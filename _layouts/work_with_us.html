{% include head.html %}

  <!-- Main Container -->
  <div class="main-container {% if page.image_side == 'left' %} image-left{% endif %}">
    <!-- Left Column - Navigation / Content -->
    <div class="left-column left-column--content">
      
      <div class="page-content">
        {{ content }}
      </div>
    </div>

    <!-- Right Column - Image / Content -->
    <div class="right-column">
      <div class="content-area">
        <form class="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
          <div class="form-row">
            <div class="form-group">
              <label for="firstName">First Name *</label>
              <input type="text" id="firstName" name="firstName" required>
            </div>
            <div class="form-group">
              <label for="lastName">Last Name</label>
              <input type="text" id="lastName" name="lastName">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="phone">Phone *</label>
              <input type="tel" id="phone" name="phone" required>
            </div>
            <div class="form-group">
              <label for="email">Email Address *</label>
              <input type="email" id="email" name="email" required>
            </div>
          </div>
          <div class="form-group">
            <label for="message">How can we help?</label>
            <textarea id="message" name="message" rows="6" placeholder="Add answer here"></textarea>
          </div>
          <button type="submit" class="form-submit">Submit</button>
        </form>
      </div>
    </div>
  </div>
{% include footer.html %}
