{% include head.html %}

  <!-- Main Container -->
  <div class="main-container {% if page.image_side == 'left' %} image-left{% endif %}">
    <!-- Left Column - Navigation / Content -->
    <div class="left-column left-column--content">
      
      <div class="page-content">
        {{ content }}
      </div>
    </div>

    <!-- Right Column - Image / Content -->
    <div class="right-column">
      <div class="content-area contact-c">
        <form class="contact-form" id="contact-form">
          <input type="hidden" id="c-p" value="aHR0cHM6Ly9uOG4uZnJvemVuc29saWRkZXNpZ25zLmNvbS93ZWJob29rL2Q2ZDQ0NzFkLWM2ZTctNDgyZC05NzcwLWIwMTc0ZmY3MWM4Yw==" readonly/>
          <div class="form-row">
            <div class="form-group">
              <label for="firstName">First Name *</label>
              <input type="text" id="firstName" name="firstName" required>
            </div>
            <div class="form-group">
              <label for="lastName">Last Name</label>
              <input type="text" id="lastName" name="lastName">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="phone">Phone *</label>
              <input type="tel" id="phone" name="phone" required>
            </div>
            <div class="form-group">
              <label for="email">Email Address *</label>
              <input type="email" id="email" name="email" required>
            </div>
          </div>
          <div class="form-group">
            <label for="message">How can we help?</label>
            <textarea id="message" name="message" rows="6" placeholder="Add answer here"></textarea>
          </div>

          <input type="hidden" id="form_started" name="form_started">
          <input type="hidden" id="js_token" name="js_token">
          <input type="hidden" id="company" name="company">
          <button type="submit" class="form-submit" id="x-btn-submit-contact">Submit</button>
        </form>

        <div id="contact-thank-you" role="status" aria-live="polite">
            <h2>Thank you!</h2>
            <p>Your message has been sent.<br />We will be in touch shortly.</p>
        </div>
      </div>
    </div>
  </div>
  <script src="{{ '/assets/js/contact.js' | relative_url }}"></script>
{% include footer.html %}
